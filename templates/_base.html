{% load static %}

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{% block title %}kalibre{% endblock title %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >
    <script src="https://code.jquery.com/jquery-3.6.4.js" integrity="sha256-a9jBBRygX1Bh5lt8GZjXDzyOB+bWve9EiO7tROUtj/E=" crossorigin="anonymous"></script>
    <script src="{% static 'js/base.js' %}"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
    body {
        font-family: 'Rubik', sans-serif;
      }
      /* Navbar Link Styling */
      nav ul li a {
        font-weight: 500;
        padding: 0.5rem 1rem;
        border-radius: 5px; /* Rounded corners for better aesthetics */
        transition: background-color 0.3s, color 0.3s ease;
        cursor: pointer; /* Ensures the pointer effect */
      }

      nav ul li a:hover {
        background-color: #4c566a; /* Soft dark background */
        color: #eceff4; /* Contrast text color */
        text-decoration: none; /* Remove underline */
      }

      /* Active Link Styling */
      nav ul li a.active {
        background-color: #a3be8c; /* Subtle green for active links */
        color: #2e3440; /* Text color for active links */
      }
    </style>
  </head>
  <body>
    <header class="container">
      <nav class="grid">
        <ul>
          <li><strong><a 
            hx-get="{% url 'home' %}" 
            hx-target="#body" 
            hx-swap="innerHTML transition:true"
            hx-push-url="true">kalibre</a></strong></li>
        </ul>
        <ul>
          {% if user.is_authenticated %}
            <li><a 
              hx-get="{% url 'my_profile' %}" 
              hx-target="body" 
              hx-swap="outerHTML transition:true"
              hx-push-url="true">my profile</a></li>
            <li><a 
              hx-get="{% url 'account_logout' %}" 
              hx-target="body" 
              hx-swap="outerHTML transition:true"
              hx-push-url="true">log out</a></li>
          {% else %}
            <li><a 
              hx-get="{% url 'account_login' %}" 
              hx-target="body" 
              hx-swap="outerHTML transition:true"
              hx-push-url="true">log in</a></li>
            <li><a 
              hx-get="{% url 'account_signup' %}" 
              hx-target="#body" 
              hx-swap="innerHTML transition:true"
              hx-push-url="true">sign up</a></li>
          {% endif %}
          <li><a 
            hx-get="{% url 'about' %}" 
            hx-target="#body" 
            hx-swap="innerHTML transition:true"
            hx-push-url="true">how to use?</a></li>
        </ul>
      </nav>
    </header>

    <main id="body" class="container">
      <section>
        {% block content %}
        {% endblock content %}
      </section>
    </main>

    <footer class="container">
      <small>© 2024 Kalibre. All rights reserved.</small>
    </footer>
  </body>
</html>
