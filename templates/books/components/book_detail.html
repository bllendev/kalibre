
<style>
    .card.grid {
        /* Modified grid setup might be necessary if width constraints cause overflow */
        display: grid;
        gap: 2.5rem;
        padding: 1rem;
        grid-template-columns: 1fr 2fr;
        align-items: start;
        max-width: 100%; /* ensure the grid doesn't exceed parent container's width */
    }

    .card-body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        height: 100%;
        overflow: hidden; /* ensure no extra content leaks out unexpectedly */
    }

    #kalibre-frame {
        border: 2px solid var(--secondary);
        border-radius: 15px;
        padding: 2rem;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
        margin: 2rem auto;
        max-width: 80vw; /* use a percentage relative to screen width */
        background-color: var(--background);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        overflow-x: hidden; /* prevent horizontal overflow */
    }

    #kalibre-frame:hover {
        transform: scale(1.01);
        box-shadow: 0 16px 45px rgba(0, 0, 0, 0.35);
    }

    .gutenberg-table {
        max-height: 20vh;
        overflow-y: auto; /* allow vertical scrolling if content overflows vertically */
        overflow-x: hidden; /* add to hide any horizontal overflow */
    }

    table {
        width: 100%; /* ensure the table fills available space without overflowing */
        table-layout: fixed; /* allow for more consistent table behavior, stopping excessive width growth by any single column */
    }

    th, td {
        word-wrap: break-word; /* ensure content wraps to prevent wide table cells */
        padding: 0.5rem; /* basic padding for better readability */
    }
</style>

<article id="kalibre-frame" class="container">
    <div class="card grid" style="gap: 2.5rem; padding: 2rem;">
        <!-- Book Cover Image -->
        <figure>
            <img src="{{ book.get_cover_url }}" alt="{{ book.title }} Cover" class="bookcover" id="book-cover">
        </figure>

        <!-- card -->
        <div class="card-body">
            <!-- Book Title -->
            <h5 class="card-title">{{ book.title }}</h5>

            <!-- Book Author -->
            <p class="card-text">
                {% if book.authors.all %}
                    Author(s): 
                    {% for author in book.authors.all %}
                        {{ author.name }}{% if not forloop.last %}, {% endif %}
                    {% endfor %}
                {% else %}
                    No Authors listed.
                {% endif %}
            </p>


            <!--dynamic div-->
            <br>
            <p class="card-text">
                Download(s): 
            </p>
            <div id="links"
                hx-trigger="load"
                hx-get="{% url 'get-gutenberg-links' book.id %}"
                hx-swap="innerHTML transition:true"
                hx-target="#links"
            ></div>

        </div>
    </div>
</article>
