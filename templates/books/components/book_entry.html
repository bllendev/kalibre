<style>
.book-row {
    flex: 1 0 21%; /* Adjusts the width for a 3x4 grid, including margins */
    margin: 0.5%;
    box-sizing: border-box;
}
.card {
    height: 100%;
    display: flex;
    flex-direction: column;
}
.card-body {
    flex-grow: 1;
}
</style>
<div class="col-6 col-md-4 col-lg-3 mb-4" id="book_{{ book.pk }}">
    <div class="card h-100">
        <div class="card-body d-flex flex-column">
            <!-- Book Cover Image -->
            {% comment %} <div class="book-cover mb-2 flex-grow-1">
                <img src="{{ book.get_cover_url }}" alt="{{ book.title }}" class="img-fluid">
            </div> {% endcomment %}
            <!-- Book Title -->
            <h5 class="card-title mb-1">
                <a hx-get="{{ book.get_absolute_url }}" 
                   hx-swap="outerHTML transition:true"
                   hx-target="body"
                   hx-push-url="true"
                   style="cursor:pointer;"
                    class="text-dark text-decoration-none">
                    {{ book.title }}
                </a>
            </h5>
            <!-- Book Author -->
            <p class="card-text small text-muted mb-1">{{ book.author }}</p>
        </div>
    </div>
</div>
