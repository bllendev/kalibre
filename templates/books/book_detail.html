{% extends '_base.html' %}
{% load static %}

{% block extra_style %}
<style>
    /* Card Styling */
    .card {
        display: grid; /* Use grid for layout */
        grid-template-columns: auto 1fr; /* Two columns: image (auto), text (flexible) */
        gap: 1rem; /* Space between image and text */
        align-items: start; /* Align items to the top */
        padding: 1rem;
        margin: 1rem auto;
        border-radius: var(--pico-border-radius);
        border: 1px solid var(--pico-color-border);
        background-color: var(--pico-color-background);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        max-width: 800px; /* Constrain width for readability */
    }

    /* Book Cover Image */
    .card img {
        width: 100%; /* Ensure image fills its grid cell */
        max-width: 300px; /* Constrain maximum width for image */
        height: auto; /* Maintain aspect ratio */
        border-radius: var(--pico-border-radius);
    }

    /* Card Body Styling */
    .card-body {
        display: flex;
        flex-direction: column; /* Stack text and button */
        gap: 0.5rem; /* Space between items */
    }

    /* Title and Text */
    .card-title {
        font-size: 1.5rem;
        font-weight: bold;
        color: var(--pico-color-primary);
        margin: 0.5rem 0;
    }

    .card-text {
        color: var(--pico-color-muted);
        font-size: 1rem;
    }

    /* Refresh Button Styling */
    .refresh-btn {
        padding: 0.6rem 1.2rem;
        border: 1px solid var(--pico-color-primary);
        background-color: var(--pico-color-primary);
        color: var(--pico-color-background);
        border-radius: var(--pico-border-radius);
        cursor: pointer;
        transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        margin-top: 1rem; /* Add spacing from the text */
    }

    .refresh-btn:hover {
        background-color: var(--pico-color-secondary);
        color: var(--pico-color-background);
        border-color: var(--pico-color-secondary);
    }

    /* Additional Details Styling */
    .text-muted {
        font-size: 0.9rem;
        color: var(--pico-color-muted);
    }
</style>
{% endblock extra_style %}

{% block title %}{{ book.title }} - Detail{% endblock title %}

{% block content %}
<article class="container mt-5">
    <div class="card grid">
        <!-- Book Cover Image -->
        <img src="{{ book.get_cover_url }}" alt="{{ book.title }} Cover" class="bookcover" id="book-cover">

        <!-- Card Body -->
        <div class="card-body">
            <!-- Book Title -->
            <h5 class="card-title">{{ book.title }}</h5>

            <!-- Book Author -->
            <p class="card-text">Author: {{ book.author }}</p>

            <!-- Refresh Button -->
            <button
              hx-get="{% url 'get-cover' book.id %}"
              hx-trigger="click"
              hx-target="#book-cover"
              hx-swap="outerHTML">Refresh Image</button>

            <!-- Additional Details -->
        </div>
    </div>
</article>
{% endblock %}
