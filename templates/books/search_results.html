{% extends '_base.html' %}
{% load static %}

{% block title %}Search{% endblock title %}
{% block content %}
<style>
    .book-row {
        transition: opacity 0.3s ease-out;
    }

    {% comment %}
        #div-search-result {
            max-height: 80vh;
            overflow-y: auto; /* Enables vertical scrolling */
            transition: opacity 1s ease;
        }
    {% endcomment %}
</style>


<div class="row justify-content-center">
    <!-- Search Bar -->
    <div class="col-10">
        <input name="q" class="form-control mr-sm-2" type="text" placeholder="try filtering here if you like!" aria-label="try filtering here if you like!"
            class="form-control mb-4"
            hx-get="{% url 'book-search' %}"  
            hx-vals="{'trigger': '', 'query': '{{query}}'}"
            hx-trigger="keyup changed delay:250ms"
            hx-target="#book_entry_list"
            hx-swap="innerHTML" 
        >
    </div>

    <!--hard query refresh open library api -->
    <div class="col-2">
        <!--refresh books btn via api-->
        <button class="btn btn-outline-primary my-2 my-sm-0" 
            id="div-fetch-books"
            hx-post="{% url 'book-search-openlibrary' %}"
            hx-trigger="click"
            hx-target="#book_entry_list"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
            hx-vals='{"query": "{{ query }}"}'
            hx-indicator="#loading_notification"
            hx-swap="beforeend"
            hx-swap="innerHTML">Refresh Search
        </button>
   </div>


<div id="div-search-result" class="row mt-5" style="transition: opacity 1s ease;">

    <!-- Loading Notification -->
    <div class="htmx-indicator" id="loading_notification">
        <img src="https://res.cloudinary.com/dmh0kulu1/image/upload/v1668730701/loading_no_background_lu50jo.gif" alt="Loading..." class="img-fluid">
    </div>

    <!-- fetch books via vector search -->
    <div id="div-fetch-books"
        hx-get="{% url 'book-search' %}"
        hx-trigger="load"
        hx-target="#book_entry_list"
        hx-vals='{"query": "{{ query }}", "trigger": "refresh-forms-openlibrary-api"}'
        hx-indicator="#loading_notification"
        hx-swap="beforeend">
    </div>

    <!-- NOTE: gets targeted by all div-fetch-books* -->
    <div id="book_entry_list" class="col-12 row"
            hx-post="{% url 'book-search-openlibrary' %}"
            hx-trigger="refresh-forms-openlibrary-api from:body"
            hx-target="#div-fetch-books-openlibrary"
            hx-vals='{"query": "{{ query }}"}'
            hx-indicator="#loading_notification"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
            hx-swap="innerHTML">
    </div>

</div>

{% endblock %}
