{% extends '_base.html' %}
{% load static %}

{% block title %}Search{% endblock title %}
{% block content %}
<style>
    .search-input-container {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1rem 0;
        width: 100%;
    }

    input.form-control {
        flex: 1;  /* Changed from flex-grow: 1 */
        height: 48px;  /* Consistent height with button */
        padding: 0 1.5rem;
    }

    button#div-fetch-books {
        height: 2rem; /* Match input height */
        padding: 0 1.5rem; /* Adjust padding for balance */
        font-size: 1rem;
        border-radius: 0.5rem;
        background-color: #81a1c1;
        margin-bottom: 1rem;
        color: #2e3440;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s ease;
    }

    button#div-fetch-books:hover {
        background-color: #5e81ac;
        transform: translateY(-2px);
    }

    /* Scrollable Table */
    #book-entry-table {
        width: 100%;
        border-collapse: collapse;
        background-color: #3b4252;
        border-radius: 0.5rem;
        overflow: hidden;
        margin-top: 2rem;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    #book-entry-table thead {
        background-color: #4c566a;
        color: #eceff4;
        font-weight: bold;
    }

    #book-entry-table th, #book-entry-table td {
        padding: 0.75rem;
        text-align: left;
        border-bottom: 1px solid #4c566a;
    }

    #book-entry-table tbody tr:hover {
        background-color: #434c5e;
    }

    /* Scrollable section */
    .scrollable-table-container {
        max-height: 60vh;
        overflow-y: auto;
        border-radius: 0.5rem;
    }

    /* Loading Indicator Styling */
    .htmx-indicator {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 2rem;
        margin-top: 1rem;
    }

    .htmx-indicator img {
        max-width: 40px;
        max-height: 40px;
        object-fit: contain;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .search-input-container {
            flex-direction: column;
            gap: 0.5rem;
        }

        button#div-fetch-books {
            width: 100%;
        }
    }
</style>

<div class="container mt-4">
    <!-- Search Bar and Refresh Button -->
    <div class="search-input-container">
        <!-- Search Input -->
        <input
            name="q"
            class="form-control"
            type="search"
            placeholder="Search books or filter here..."
            aria-label="Search books or filter here..."
            hx-get="{% url 'book-search' query %}"  
            hx-vals="{'trigger': '', 'query': '{{ query }}'}"
            hx-trigger="keyup changed delay:250ms"
            hx-target="#book_entry_list"
            hx-swap="innerHTML" 
        />

        <!-- refresh button -->
        <button
            id="div-fetch-books"
            hx-post="{% url 'book-search-openlibrary' %}"
            hx-trigger="click"
            hx-target="#book_entry_list"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
            hx-vals='{"query": "{{ query }}"}'
            hx-indicator="#loading_notification"
            hx-swap="afterend">
            Refresh
        </button>
    </div>

    <!-- scrollable table section -->
    <div id="div-search-result" class="mt-5">
        <!-- loading notification -->
        <div class="htmx-indicator" id="loading_notification">
            <img src="https://res.cloudinary.com/dmh0kulu1/image/upload/v1668730701/loading_no_background_lu50jo.gif" alt="Loading...">
        </div>

        <!-- fetch Books via Vector Search -->
        <div 
            hx-get="{% url 'book-search' %}"
            hx-trigger="load"
            hx-target="#book_entry_list"
            hx-vals='{"query": "{{ query }}", "trigger": "refresh-forms-openlibrary-api"}'
            hx-indicator="#loading_notification"
            hx-swap="innerHTML">
        </div>

        <!-- Book Entry List -->
        <div id="book_entry_list" class="mt-4 scrollable-table-container"> </div>
    </div>
</div>
{% endblock %}
