<style>
    /* Styling for the Kalibre interface */
    #kalibre-frame {
        border: 2px solid var(--secondary);
        border-radius: 15px;
        padding: 2rem;
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.2);
        margin: 2rem auto;
        max-width: 800px;
        background-color: var(--background);
        transition: transform 0.3s ease, box-shadow 0.3s ease; /* Transition for smoothness */
    }

    #kalibre-frame:hover {
        transform: scale(1.01); /* Slightly enlarge the frame */
        box-shadow: 0 8px 35px rgba(0, 0, 0, 0.25); /* Enhanced shadow for hover */
    }

    #blue_reading_img {
        max-width: 65%;
        margin: auto;
        display: block;
    }

    #search-input-container {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: center;
    }

    #toggle-ai-librarian {
        padding: 5px;
        border: 1px solid var(--secondary);
        border-radius: 50%;
        height: 50px;
        width: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--primary);
    }

    #ai-chatbox {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        height: 333px;
        border: 1px solid var(--secondary);
        border-radius: 0.5rem;
        padding: 1rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        background-color: var(--card-background);
        margin-top: 1rem;
    }

    .user-message, .ai-response {
        border-bottom: 1px solid var(--secondary);
        margin-bottom: 10px;
        padding-bottom: 10px;
    }

    .user-message {
        background-color: var(--primary-light);
        border-radius: 10px;
        padding: 10px;
    }

    .ai-response {
        background-color: var(--secondary-light);
        border-radius: 10px;
        padding: 10px;
    }

    #message-container {
        overflow-y: auto;
        flex: 1;
    }

    textarea {
        width: 100%;
        resize: none;
    }

    /* Loading animation */
    .loading-animation {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 5px;
    }

    .dot {
        width: 8px;
        height: 8px;
        background-color: var(--primary);
        border-radius: 50%;
        display: inline-block;
        animation: bounce 1.5s infinite ease-in-out;
    }

    .dot:nth-child(2) {
        animation-delay: -0.4s;
    }

    .dot:nth-child(3) {
        animation-delay: -0.8s;
    }

    @keyframes bounce {
        0%, 80%, 100% {
            transform: translateY(0);
        }
        40% {
            transform: translateY(-15px);
        }
    }
</style>
</head>
<body>
<div id="kalibre-frame">
    <div class="text-center">
        <h1 class="kalibre-title" style="font-size: 3rem; color: var(--primary);">kalibre</h1>
        <div id="blue_reading_div" class="text-center">
            <!-- Dynamically loaded image -->
        </div>
        <div id="search-input-container">
            <input
                id="search-query"
                name="query"
                type="text"
                placeholder="What do you wanna read?"
                required
                hx-get="{% url 'search-results' %}"
                hx-params="*"
                hx-target="body"
                hx-push-url="true"
                hx-swap="innerHTML"
                class="form-control"
            />
            <button
                id="toggle-ai-librarian"
                onclick='$("#ai-chatbox").fadeToggle();'
                title="Toggle AI Librarian"
                type="button"
            >
                <img
                    id="toggle-ai-image"
                    src="https://res.cloudinary.com/dmh0kulu1/image/upload/c_thumb,w_200,g_face/v1685492031/kalibre_head_0_c4ln7c.png"
                    alt="AI Librarian Icon"
                    width="40"
                    height="40"
                />
            </button>
        </div>
        <div id="ai-chatbox" style="display: none;">
            <div id="message-container">
                <!-- Messages dynamically added -->
            </div>
            <textarea
                class="form-control"
                {% if not request.user.is_authenticated %}readonly{% endif %}
                placeholder="{% if request.user.is_authenticated %}Hi, I'm Kalibre! What type of book are you looking for?{% else %}Hi, I'm Kalibre! Please log in or create an account to get started!{% endif %}"
            ></textarea>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function () {
        // Dynamically load the reading GIF
        var blueReadingImg = $('<img id="blue_reading_img">');
        blueReadingImg.attr('src', "https://res.cloudinary.com/dmh0kulu1/image/upload/c_crop,h_1526,w_2048,y_840/v1669424019/Animated-GIF-Export_qqnhmb.gif");
        blueReadingImg.appendTo('#blue_reading_div');

        // Kalibre face animation
        const kalibreFaces = [
            "https://res.cloudinary.com/dmh0kulu1/image/upload/c_thumb,w_200,g_face/v1685492031/kalibre_head_0_c4ln7c.png",
            "https://res.cloudinary.com/dmh0kulu1/image/upload/c_thumb,w_200,g_face/v1685492030/kalibre_head_1_sel9zm.png",
            "https://res.cloudinary.com/dmh0kulu1/image/upload/c_thumb,w_200,g_face/v1685492030/kalibre_head_2_p6cddp.png",
            "https://res.cloudinary.com/dmh0kulu1/image/upload/c_thumb,w_200,g_face/v1685492031/kalibre_head_3_nbzijn.png",
            "https://res.cloudinary.com/dmh0kulu1/image/upload/c_thumb,w_200,g_face/v1685492031/kalibre_head_4_dbjaoj.png",
            "https://res.cloudinary.com/dmh0kulu1/image/upload/c_thumb,w_200,g_face/v1685492031/kalibre_head_5_uo1feu.png"
        ];
        $('#toggle-ai-librarian').mouseover(function () {
            const randomIndex = Math.floor(Math.random() * kalibreFaces.length);
            $('#toggle-ai-image').attr('src', kalibreFaces[randomIndex]);
        });

        // Handle Enter key for sending messages
        $("textarea").on("keydown", function (event) {
            if (event.key === "Enter") {
                event.preventDefault();
                const userMessage = $(this).val().trim();
                if (userMessage) {
                    // Add user message to the chat
                    const messageDiv = $("<div>").text(userMessage).addClass("user-message");
                    $("#message-container").append(messageDiv);
                    $(this).val(""); // Clear the textarea

                    // Show loading animation
                    const loadingDiv = $("<div>").addClass("loading-animation").append(
                        $("<div>").addClass("dot"),
                        $("<div>").addClass("dot"),
                        $("<div>").addClass("dot")
                    );
                    $("#message-container").append(loadingDiv);

                    // Simulate AI response
                    setTimeout(() => {
                        loadingDiv.remove();
                        const aiResponse = $("<div>").text("This is a simulated AI response.").addClass("ai-response");
                        $("#message-container").append(aiResponse);
                    }, 1500);
                }
            }
        });
    });
</script>
