<style>
    #kalibre-frame {
        border: 2px solid var(--secondary);
        border-radius: 15px;
        padding: 2rem;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3); /* Increased the blur and opacity */
        margin: 2rem auto;
        max-width: 80vh;
        background-color: var(--background);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    #kalibre-frame:hover {
        transform: scale(1.01);
        box-shadow: 0 16px 45px rgba(0, 0, 0, 0.35); /* Further increased for hover effect */
    }

    #blue_reading_img {
        max-width: 65%;
        margin: auto;
        display: block;
    }

    #search-input-container {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: center;
    }

    #toggle-ai-librarian {
        padding: 5px;
        justify-self: end;
        align-self: center;
        margin-right: 0.5rem;
        background-color: var(--primary);
        border: 1px solid var(--secondary);
        border-radius: 50%;
        height: 50px;
        width: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #ai-chatbox {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        height: 333px;
        border: 1px solid var(--secondary);
        border-radius: 0.5rem;
        padding: 1rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        background-color: var(--card-background);
        margin-top: 1rem;
    }

    .user-message, .ai-response {
        border-bottom: 1px solid var(--secondary);
        margin-bottom: 10px;
        padding-bottom: 10px;
    }

    .user-message {
        background-color: var(--primary-light);
        border-radius: 10px;
        padding: 10px;
    }

    .ai-response {
        background-color: var(--secondary-light);
        border-radius: 10px;
        padding: 10px;
    }

    #message-container {
        overflow-y: auto;
        flex: 1;
    }

    textarea {
        width: 100%;
        resize: none;
    }

    .loading-animation {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 5px;
    }

    #main-card-content {
        transition: transform 0.5s ease, opacity 0.5s ease;
    }

    #search-view,
    #chat-view {
        transition: opacity 0.5s ease;
    }

    .hidden {
        display: none;
        opacity: 0;
    }

    .visible {
        display: block;
        opacity: 1;
    }

    @keyframes bounce {
        0%, 80%, 100% {
            transform: translateY(0);
        }
        40% {
            transform: translateY(-15px);
        }
    }
</style>
<div id="kalibre-frame">
    <div class="text-center">
        <div>
            <div>
            <h1 class="kalibre-title" style="font-size: 3rem; color: var(--primary);">kalibre</h1>

            {% if request.user.is_authenticated %}
                <button
                    class="grid"
                    id="toggle-ai-librarian"
                    title="Toggle AI Librarian"
                    type="button"
                >
                    <img
                        id="toggle-ai-image"
                        src="https://res.cloudinary.com/dmh0kulu1/image/upload/c_thumb,w_200,g_face/v1685492031/kalibre_head_0_c4ln7c.png"
                        alt="AI Librarian Icon"
                        width="40"
                        height="40"
                    />
                </button>
            {% endif %}
        </div>

        <div id="main-card-content">
            <div id="search-view" class="visible">
                <div id="blue_reading_div" class="text-center"></div>
                <div id="search-input-container">
                    <input
                        id="search-query"
                        name="query"
                        type="text"
                        placeholder="What do you wanna read?"
                        required
                        hx-get="{% url 'search-results' %}"
                        hx-params="*"
                        hx-target="body"
                        hx-push-url="true"
                        hx-swap="innerHTML transition:true"
                        class="form-control"
                    />
                </div>
            </div>

            <div id="chat-view" class="hidden">
                <div id="ai-chatbox">
                    <div id="message-container">
                        <!-- Dynamically add messages here -->
                    </div>
                    <textarea
                        id="chat-input"
                        class="form-control"
                        {% if not request.user.is_authenticated %}readonly{% endif %}
                        placeholder="{% if request.user.is_authenticated %}Hi, I'm Kalibre! What type of book are you looking for?{% else %}Hi, I'm Kalibre! Please log in or create an account to get started!{% endif %}"
                    ></textarea>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    $(document).ready(function () {
        let conversationId = null;

        let kalibre_faces = [
           "https://res.cloudinary.com/dmh0kulu1/image/upload/c_thumb,w_200,g_face/v1685492031/kalibre_head_0_c4ln7c.png",
           "https://res.cloudinary.com/dmh0kulu1/image/upload/c_thumb,w_200,g_face/v1685492030/kalibre_head_1_sel9zm.png",
           "https://res.cloudinary.com/dmh0kulu1/image/upload/c_thumb,w_200,g_face/v1685492030/kalibre_head_2_p6cddp.png",
           "https://res.cloudinary.com/dmh0kulu1/image/upload/c_thumb,w_200,g_face/v1685492031/kalibre_head_3_nbzijn.png",
           "https://res.cloudinary.com/dmh0kulu1/image/upload/c_thumb,w_200,g_face/v1685492031/kalibre_head_4_dbjaoj.png",
           "https://res.cloudinary.com/dmh0kulu1/image/upload/c_thumb,w_200,g_face/v1685492031/kalibre_head_5_uo1feu.png"
        ];

        // Image hover functionality
        $('#toggle-ai-librarian').mouseover(function () {
           let randomIndex = Math.floor(Math.random() * kalibre_faces.length);
           $('#toggle-ai-image').attr('src', kalibre_faces[randomIndex]);
        });

        // Initialize dynamics
        loadImage('#blue_reading_div');
        
        function loadImage(containerSelector) {
            const imageExists = $(containerSelector).find('#blue_reading_img').length > 0;
            if (!imageExists) {
                const blueReadingImg = $('<img id="blue_reading_img">');
                blueReadingImg.attr('src', "https://res.cloudinary.com/dmh0kulu1/image/upload/c_crop,h_1526,w_2048,y_840/v1669424019/Animated-GIF-Export_qqnhmb.gif");
                blueReadingImg.appendTo(containerSelector);
            }
        }

        // Function to fetch or create a conversation ID
        function getOrCreateConversationID() {
            if (conversationId == null) {
                return createConversation();
            } else {
                return Promise.resolve(conversationId);
            }
        }

        // Function to create a new conversation
        function createConversation() {
            return new Promise((resolve, reject) => {
                $.ajax({
                    url: "/ai/create-conversation/",
                    type: "POST",
                    headers: {
                        "X-CSRFToken": getCookie("csrftoken"),
                    },
                    success: function (data) {
                        if (data && data.conversation_id) {
                            conversationId = data.conversation_id;
                            resolve(conversationId);
                        } else {
                            reject("Failed to obtain conversation ID");
                        }
                    },
                    error: function (xhr, textStatus, errorThrown) {
                        reject("Error: " + errorThrown);
                    },
                });
            });
        }

        // Logic for toggling views
        $("#toggle-ai-librarian").click(function () {
            const searchView = $("#search-view");
            const chatView = $("#chat-view");

            if (searchView.is(":visible")) {
                searchView.addClass("hidden").removeClass("visible");
                getOrCreateConversationID().then((id) => {
                    chatView.addClass("visible").removeClass("hidden");
                    console.log("Initialized conversation with ID: " + id);
                }).catch(error => {
                    console.error("Failed to create conversation: ", error);
                });
            } else {
                chatView.addClass("hidden").removeClass("visible");
                searchView.addClass("visible").removeClass("hidden");
                loadImage('#blue_reading_div'); // Ensure the image loads when switching back
            }
        });

        // Handle chat functionality
        $("#chat-input").on("keydown", function (event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                const userMessage = $(this).val().trim();
                if (userMessage) {
                    const messageDiv = $("<div>")
                        .text(userMessage)
                        .addClass("user-message");
                    $("#message-container").append(messageDiv);
                    $(this).val("");

                    const loadingDiv = $("<div>")
                        .addClass("loading-animation")
                        .append("<div class='dot'></div><div class='dot'></div><div class='dot'></div>");
                    $("#message-container").append(loadingDiv);

                    getAiLibrarianResponse(userMessage).then((response) => {
                        loadingDiv.remove();
                        const aiResponseDiv = $("<div>")
                            .text(response)
                            .addClass("ai-response");
                        $("#message-container").append(aiResponseDiv);
                    }).catch((error) => {
                        loadingDiv.remove();
                        console.error("Error fetching AI response: ", error);
                    });
                }
            }
        });

        // Function to fetch AI response
        function getAiLibrarianResponse(userMessage) {
            return new Promise((resolve, reject) => {
                $.ajax({
                    url: "/ai/ai-librarian/",
                    type: "POST",
                    headers: {
                        "X-CSRFToken": getCookie("csrftoken"),
                    },
                    data: {
                        user_message: JSON.stringify(userMessage),
                        conversation_id: conversationId,
                    },
                    success: function (data) {
                        if (data && data.message) {
                            resolve(data.message);
                        } else {
                            reject("No message received from AI");
                        }
                    },
                    error: function (xhr, textStatus, errorThrown) {
                        reject("Error: " + errorThrown);
                    },
                });
            });
        }

        // Function to get CSRF token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

    });
</script>
